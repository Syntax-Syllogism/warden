# warden CI Pipeline
#
# Runs deterministic checks on every pull request and push to master.
# No Salesforce org credentials required (NUTs live separately).

name: CI

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']

jobs:
  ci:
    name: CI Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn
          # @syntax-syllogism/docs-theme is only on GitHub Packages, and the
          # per-repo GITHUB_TOKEN cannot read packages from another repo.
          registry-url: https://npm.pkg.github.com
          scope: '@syntax-syllogism'

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}

      - name: Build
        run: yarn build

      - name: Test
        run: yarn test
