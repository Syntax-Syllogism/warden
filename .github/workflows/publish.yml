name: Publish to npm

on:
  push:
    branches: [release]

permissions:
  id-token: write
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish npm package
    # The release branch is pushed to both the private origin and the public
    # mirror, so without this guard the private repository also tries to
    # publish and fails on every release — it has no trusted-publisher claim,
    # and the version has already been taken by the mirror's successful run.
    if: github.repository == 'Syntax-Syllogism/warden'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: yarn

      # The project .npmrc maps @syntax-syllogism to GitHub Packages for the
      # docs-theme devDependency. Add read auth for it to the user config that
      # setup-node created, leaving the npmjs publish auth untouched.
      - name: Authenticate to GitHub Packages
        run: echo "//npm.pkg.github.com/:_authToken=${PACKAGES_READ_TOKEN}" >> "$NPM_CONFIG_USERCONFIG"
        env:
          PACKAGES_READ_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Test
        run: yarn test

      # Build the tarball once. `npm pack` runs prepack (sf-prepack: yarn build
      # + oclif manifest), so this is the real artifact npm would publish.
      - name: Pack
        run: npm pack

      # Guard against shipping an empty package (the failure mode behind the
      # command-less 0.1.0). Inspects the actual tarball: it must contain
      # compiled command files and a manifest listing at least one command.
      - name: Verify tarball contents
        run: node scripts/verify-pack.mjs

      # The registry is pinned because the project .npmrc scope mapping would
      # otherwise send this package to GitHub Packages.
      - name: Publish to npm
        run: npm publish *.tgz --access public --provenance --@syntax-syllogism:registry=https://registry.npmjs.org
